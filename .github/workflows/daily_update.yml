name: Daily HodgesIndex Update

on:
  schedule:
    # Runs daily at 11:00 UTC (6:00 AM ET / 3:00 AM PT)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy

      - name: Fetch latest 2026-27 games & rebuild HodgesIndex
        run: python3 update_2027_season.py

      - name: Commit & push updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html site_payload.json 2027_super_sked.json 2027_team_results.json
          git diff --staged --quiet || git commit -m "Daily HodgesIndex update ($(date +%Y-%m-%d))"
          git push
