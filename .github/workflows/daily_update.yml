name: Daily HodgesIndex Update

on:
  schedule:
    # Off-minute schedule starting at 6:17 UTC (1:17 AM ET) every 2h through 16:17 UTC (11:17 AM ET)
    # Offsets GitHub Actions' 4-5h cron queue delay so the morning update lands by ~6-8 AM ET
    - cron: "17 6,8,10,12,14,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy

      - name: Fetch latest 2026-27 games & rebuild HodgesIndex
        run: python3 update_2027_season.py

      - name: Commit & push updated rankings and history archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html site_payload.json 2027_super_sked.json 2027_team_results.json vegas_lines_2027.json history/
          git diff --staged --quiet || git commit -m "Daily HodgesIndex update ($(date +%Y-%m-%d))"
          git push
